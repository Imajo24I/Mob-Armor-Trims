modLoader = "javafml"
loaderVersion = "*"
issueTrackerURL = "${issues_link}"
license = "LGPL-3.0-only"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "majo24"
description = "${description}"
logoFile = "assets/naturally_trimmed/icon.png"

[["dependencies.${id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_constraint}"
ordering = "NONE"
side = "BOTH"

[["dependencies.${id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${mc}"
ordering = "NONE"
side = "BOTH"

[["dependencies.${id}"]]
modId = "yet_another_config_lib_v3"
mandatory = false
versionRange = "[${yacl},)"
ordering = "AFTER"
side = "CLIENT"

[[mixins]]
config="naturally_trimmed.mixins.json"
