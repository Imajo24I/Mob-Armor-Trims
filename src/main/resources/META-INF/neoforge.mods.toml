modLoader = "javafml"
loaderVersion = "*"
issueTrackerURL = "${issues_link}"
license = "LGPL-3.0-only"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "majo24"
description = "${description}"
logoFile = "assets/naturally_trimmed/icon.png"

[["dependencies.{id}"]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_constraint}"
ordering = "NONE"
side = "BOTH"

[["dependencies.{id}"]]
modId = "minecraft"
type = "required"
versionRange = "${mc}"
ordering = "NONE"
side = "BOTH"

[["dependencies.{id}"]]
modId = "yet_another_config_lib_v3"
type = "optional"
reason = "Yet Another Config Lib is highly recommended, as it is required to configure this mod through the Config Menu of Neoforge."
versionRange = "[${yacl},)"
ordering = "AFTER"
side = "CLIENT"

[[mixins]]
config = "naturally_trimmed.mixins.json"